name: android

on:
  push:
    branches: [main]
    paths: ['app-android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aethernet-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version
        id: ver
        run: |
          V=$(cut -d' ' -f1 app-android/VERSION | tr -d '[:space:]')
          C=$(cut -d' ' -f2 app-android/VERSION | tr -d '[:space:]')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Building AetherNet v$V (code $C)"

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.AETHERNET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aethernet-release.jks"
            echo "AETHERNET_KEYSTORE=$RUNNER_TEMP/aethernet-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::AETHERNET_KEYSTORE_BASE64 not set — building UNSIGNED"
          fi

      - name: Assemble release
        env:
          AETHERNET_KEYSTORE_PASSWORD: ${{ secrets.AETHERNET_KEYSTORE_PASSWORD }}
          AETHERNET_KEY_ALIAS: ${{ secrets.AETHERNET_KEY_ALIAS }}
          AETHERNET_KEY_PASSWORD: ${{ secrets.AETHERNET_KEY_PASSWORD }}
        run: gradle -p "$GITHUB_WORKSPACE/app-android" assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app-android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/AetherNet.apk"
          ls -la "$RUNNER_TEMP/out"

      - name: Verify signature
        run: |
          APK="$RUNNER_TEMP/out/AetherNet.apk"
          if [ -f "$RUNNER_TEMP/aethernet-release.jks" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5
          else
            echo "unsigned build — skipping apksigner verify"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherNet-v${{ steps.ver.outputs.name }}
          path: ${{ runner.temp }}/out/AetherNet.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (the update channel)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v${{ steps.ver.outputs.name }}
        run: |
          APK="$RUNNER_TEMP/out/AetherNet.apk"
          NOTES=$(printf 'AetherNet v%s — the client of the AetherNet carrier network.\n\n- Liquid Glass UI, icy-blue accent\n- on-device Ed25519 identity, tiered number (500/700/900) derived from your key\n- GitHub registry claim with collision re-derivation\n- LAN talk-layer v0: encrypted beacons, direct messages, store-and-forward spool\n- background relay: your phone is a node\n\nInstall: open the APK, allow "install unknown apps" if asked.' "${{ steps.ver.outputs.name }}")
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AetherNet $TAG" --notes "$NOTES"
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
